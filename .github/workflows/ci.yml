name: Build Custom CleanYourTV Launcher

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build APK
      run: |
        PROJECT_DIR=$(find . -maxdepth 2 \( -name "settings.gradle*" -o -name "build.gradle*" \) -exec dirname {} \; | head -n 1)
        if [ -z "$PROJECT_DIR" ]; then
          PROJECT_DIR="tvhome"
        fi
        echo "Building Gradle project in: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleRelease || ./gradlew assembleDebug
        else
          gradle assembleRelease || gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CleanYourTV-Glass-Launcher
        path: '**/build/outputs/apk/**/*.apk'
